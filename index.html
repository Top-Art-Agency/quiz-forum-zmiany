<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ekran quizu</title>
<script src="config.js"></script>
<script src="brand.js"></script>
<style>
  :root{
    --bg:#0E1020; --surface:#181B33; --text:#fff; --muted:#9AA0C3; --primary:#6C5CE7; --accent:#FFC531;
    --correct:#22C55E; --wrong:#EF4444; --a0:#6C5CE7; --a1:#00B4D8; --a2:#FF7A45; --a3:#E84393;
    --font-heading:system-ui, sans-serif; --font-body:system-ui, sans-serif; --heading-style:normal;
    --line:color-mix(in srgb, var(--text) 12%, transparent);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{ background:var(--bg); color:var(--text); font-family:var(--font-body); display:flex; flex-direction:column; min-height:100vh; overflow:hidden; }
  body::before{ content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:radial-gradient(60% 50% at 15% 0%, color-mix(in srgb, var(--primary) 35%, transparent), transparent 70%),
               radial-gradient(50% 40% at 100% 100%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 70%); }
  header, main, #controls{ position:relative; z-index:1; }
  .brand .name, .lobby-join h2, .lobby-players h3, .q-text, .timer .num, .answered .big, .board-title, .pod .who, .pod .block, .row .pos{ font-style:var(--heading-style); }
  .brand .name, .lobby-join h2, .lobby-players h3, .board-title{ text-transform:uppercase; }
  .q-text{ font-size:clamp(30px, 4.6vw, 62px); line-height:1.1; }

  header{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 32px; }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand img{ height:52px; width:auto; }
  .brand .name{ font-family:var(--font-heading); font-weight:800; font-size:26px; letter-spacing:.5px; line-height:1.1; }
  .brand .tag{ color:var(--muted); font-size:14px; margin-top:2px; }
  .hdr-right{ display:flex; align-items:center; gap:14px; }
  .pill{ background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:8px 16px; font-size:15px; font-weight:700; white-space:nowrap; }
  .pill b{ color:var(--accent); }
  .icon-btn{ background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:10px; padding:8px 11px; font:600 13px var(--font-body); cursor:pointer; }
  .icon-btn:hover{ color:var(--text); border-color:var(--muted); }

  main{ flex:1; min-height:0; display:flex; padding:6px 32px 12px; }
  .view{ display:none; flex:1; min-height:0; }
  .view.on{ display:flex; }

  /* ---- LOBBY ---- */
  #vLobby{ gap:32px; align-items:stretch; }
  .lobby-join{ flex:0 0 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:var(--surface); border-radius:24px; padding:28px; border:1px solid var(--line); }
  .lobby-join h2{ font-family:var(--font-heading); font-size:30px; font-weight:800; text-align:center; }
  .lobby-join p{ color:var(--muted); font-size:15px; text-align:center; max-width:320px; }
  #qr{ background:#fff; padding:14px; border-radius:16px; }
  #qr img, #qr canvas{ display:block; width:min(34vh, 300px) !important; height:auto !important; }
  #joinUrl{ font-size:13px; color:var(--wrong); max-width:330px; text-align:center; }
  #joinUrl:empty{ display:none; }
  .qr-wait{ width:min(34vh, 300px); aspect-ratio:1; display:flex; align-items:center; justify-content:center; text-align:center; color:#555; font-size:15px; padding:20px; }
  .lobby-players{ flex:1; min-width:0; display:flex; flex-direction:column; gap:14px; }
  #kvImg{ align-self:flex-start; max-width:100%; width:auto; height:auto; max-height:44vh; object-fit:contain; border-radius:20px; border:1px solid var(--line); flex:0 0 auto; }
  .ed-actions{ display:flex; gap:8px; }
  .lobby-players h3{ font-family:var(--font-heading); font-size:22px; font-weight:800; }
  .lobby-players h3 span{ color:var(--accent); }
  #playerChips{ display:flex; flex-wrap:wrap; gap:10px; align-content:flex-start; overflow:auto; }
  .chip{ background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:10px 18px; font-weight:700; font-size:18px; }
  .chip.new{ animation:pop .35s ease; }
  .chip.off{ opacity:.4; }
  @keyframes pop{ from{ transform:scale(.6); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .empty{ color:var(--muted); font-size:16px; }
  .hint{ font-size:12px; color:var(--muted); line-height:1.6; }
  #restoreNote{ font-size:13px; color:var(--accent); }

  /* ---- QUESTION ---- */
  #vQuestion, #vReveal{ flex-direction:column; gap:18px; }
  .q-top{ display:flex; align-items:center; justify-content:space-between; gap:24px; }
  .q-progress{ color:var(--muted); font-weight:700; font-size:16px; letter-spacing:1px; }
  .q-text{ font-family:var(--font-heading); font-weight:800; font-size:clamp(26px, 4.2vw, 54px); line-height:1.2; text-align:center; padding:0 4%; flex:0 0 auto; }
  .q-mid{ flex:1; display:flex; align-items:center; justify-content:center; gap:40px; min-height:0; }
  .timer{ position:relative; width:150px; height:150px; flex:0 0 auto; }
  .timer svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .timer .track{ stroke:var(--surface); }
  .timer .bar{ stroke:var(--accent); transition:stroke-dashoffset .25s linear, stroke .3s; }
  .timer.low .bar{ stroke:var(--wrong); }
  .timer .num{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-heading); font-weight:800; font-size:52px; }
  .answered{ text-align:center; }
  .answered .big{ font-family:var(--font-heading); font-weight:800; font-size:52px; }
  .answered .lbl{ color:var(--muted); font-size:15px; }
  .opts{ display:grid; grid-template-columns:1fr 1fr; gap:14px; flex:0 0 auto; }
  .opt{ position:relative; display:flex; align-items:center; gap:16px; padding:20px 22px; border-radius:16px; font-weight:700; font-size:clamp(18px, 2.2vw, 28px); color:#fff; overflow:hidden; transition:opacity .3s, transform .3s; }
  .opt .L{ flex:0 0 auto; width:46px; height:46px; border-radius:12px; background:rgba(255,255,255,.22); display:flex; align-items:center; justify-content:center; font-weight:800; }
  .opt .T{ flex:1; position:relative; z-index:1; }
  .opt .cnt{ position:relative; z-index:1; font-weight:800; }
  .opt .fill{ position:absolute; inset:0 auto 0 0; background:rgba(0,0,0,.18); width:0; transition:width .8s ease; }
  .qimg-wrap{ display:none; flex:1; min-width:0; height:100%; max-height:100%; align-items:center; justify-content:center; }
  .qimg-wrap.on{ display:flex; }
  .qimg-wrap img{ max-width:100%; max-height:100%; object-fit:contain; border-radius:16px; box-shadow:0 10px 40px rgba(0,0,0,.35); }
  .r-mid{ flex:1; min-height:0; display:flex; justify-content:center; }
  .opt .oimg{ position:relative; z-index:1; flex:0 0 auto; height:min(12vh, 110px); width:min(12vh, 110px); object-fit:cover; border-radius:10px; background:rgba(255,255,255,.15); margin:-8px 0; }
  .opt.img-only .oimg{ height:min(16vh, 150px); width:auto; max-width:70%; aspect-ratio:auto; object-fit:contain; margin:-10px auto; }
  .opt.img-only .T{ display:none; }
  .opt0{ background:var(--a0); } .opt1{ background:var(--a1); } .opt2{ background:var(--a2); } .opt3{ background:var(--a3); }
  .opt4{ background:#7A8A99; } .opt5{ background:#56606B; }
  #vReveal .opt.dim{ opacity:.28; }
  #vReveal .opt.ok{ outline:4px solid var(--correct); outline-offset:3px; transform:scale(1.02); }
  .opt.ok .L::after{ content:'✓'; }
  .opt.ok .L span{ display:none; }

  .round-top{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .rt{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 16px; display:flex; gap:10px; align-items:baseline; font-size:18px; }
  .rt .p{ color:var(--accent); font-weight:800; }
  .rt .s{ color:var(--muted); font-size:14px; }
  .nobody{ text-align:center; color:var(--muted); font-size:20px; }

  /* ---- LEADERBOARD ---- */
  #vBoard{ flex-direction:column; gap:16px; align-items:center; }
  .board-title{ font-family:var(--font-heading); font-weight:800; font-size:clamp(28px, 3.6vw, 44px); }
  #boardList{ width:min(900px, 100%); display:flex; flex-direction:column; gap:8px; overflow:auto; }
  .row{ display:grid; grid-template-columns:56px 1fr 130px 110px; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 18px; font-size:20px; }
  .row .pos{ font-family:var(--font-heading); font-weight:800; color:var(--muted); }
  .row .nm{ font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .pts{ text-align:right; font-weight:800; color:var(--accent); }
  .row .tm{ text-align:right; color:var(--muted); font-size:16px; }
  .row.top1 .pos{ color:#FFD24A; } .row.top2 .pos{ color:#C9D1DC; } .row.top3 .pos{ color:#E19A5B; }
  .row.head{ background:transparent; border:none; padding:0 18px; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
  .delta{ font-size:13px; color:var(--correct); margin-left:8px; font-weight:700; }

  /* ---- FINAL / PODIUM ---- */
  #vFinal{ flex-direction:column; align-items:center; gap:14px; }
  .podium{ display:flex; align-items:flex-end; justify-content:center; gap:18px; margin-top:6px; }
  .pod{ display:flex; flex-direction:column; align-items:center; gap:8px; width:min(24vw, 260px); }
  .pod .who{ font-family:var(--font-heading); font-weight:800; font-size:clamp(18px, 2.2vw, 30px); text-align:center; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pod .sc{ color:var(--accent); font-weight:800; font-size:20px; }
  .pod .tm{ color:var(--muted); font-size:14px; }
  .pod .block{ width:100%; border-radius:16px 16px 0 0; display:flex; align-items:flex-start; justify-content:center; padding-top:14px; font-family:var(--font-heading); font-weight:800; font-size:54px; color:rgba(0,0,0,.45); animation:rise .9s cubic-bezier(.2,.9,.3,1.2) both; }
  .pod.p1 .block{ height:30vh; background:linear-gradient(#FFE27A,#E8B21E); animation-delay:1.1s; }
  .pod.p2 .block{ height:21vh; background:linear-gradient(#EEF2F7,#AAB4C2); animation-delay:.6s; }
  .pod.p3 .block{ height:15vh; background:linear-gradient(#F3B985,#C27A3E); animation-delay:.1s; }
  .pod.p1 .info{ animation:fade .5s 1.8s both; } .pod.p2 .info{ animation:fade .5s 1.3s both; } .pod.p3 .info{ animation:fade .5s .8s both; }
  .pod .info{ display:flex; flex-direction:column; align-items:center; gap:2px; max-width:100%; }
  @keyframes rise{ from{ transform:scaleY(0); transform-origin:bottom; } to{ transform:scaleY(1); transform-origin:bottom; } }
  @keyframes fade{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
  #finalRest{ width:min(900px,100%); display:flex; flex-direction:column; gap:6px; overflow:auto; max-height:22vh; }
  #finalRest .row{ font-size:16px; padding:8px 16px; }

  /* ---- CONTROLS ---- */
  #controls{ display:flex; align-items:center; justify-content:center; gap:10px; padding:10px 32px 18px; flex-wrap:wrap; }
  .btn{ font:800 15px var(--font-body); letter-spacing:.5px; border:none; border-radius:12px; padding:14px 26px; cursor:pointer; background:var(--primary); color:#fff; }
  .btn:hover{ filter:brightness(1.1); }
  .btn.ghost{ background:transparent; color:var(--muted); border:1px solid var(--line); font-weight:700; padding:12px 18px; }
  .btn.ghost:hover{ color:var(--text); }
  .btn[hidden]{ display:none; }
  .kbd{ color:var(--muted); font-size:12px; }
  body.clean #controls .btn.ghost, body.clean .kbd{ display:none; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <img data-brand="logo" alt="">
    <div><div class="name" data-brand="name">QUIZ</div><div class="tag" data-brand="tagline"></div></div>
  </div>
  <div class="hdr-right">
    <div class="pill" id="pillPlayers"><b>0</b> graczy</div>
    <button class="icon-btn" id="btnLang">EN</button>
    <button class="icon-btn" id="btnFull" title="Pełny ekran">⛶</button>
  </div>
</header>

<main>
  <!-- LOBBY -->
  <section class="view" id="vLobby">
    <div class="lobby-join">
      <h2 id="tJoin">Dołącz do gry!</h2>
      <div id="qr"></div>
      <p id="tJoinSub">Zeskanuj kod telefonem, wpisz swoje imię i czekaj na pierwsze pytanie.</p>
      <div id="joinUrl"></div>
    </div>
    <div class="lobby-players">
      <img id="kvImg" data-brand="kv" alt="">
      <h3><span id="tPlayers">Gracze</span> · <span id="lobbyCount">0</span></h3>
      <div id="restoreNote"></div>
      <div id="playerChips"><div class="empty" id="tNoPlayers">Czekamy na pierwszych graczy…</div></div>
      <div class="hint" id="qCount"></div>
    </div>
  </section>

  <!-- QUESTION -->
  <section class="view" id="vQuestion">
    <div class="q-top"><div class="q-progress" id="qProg"></div><div class="q-progress" id="qPts"></div></div>
    <div class="q-text" id="qText"></div>
    <div class="q-mid">
      <div class="timer" id="timer">
        <svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="44" fill="none" stroke-width="10"/><circle class="bar" id="timerBar" cx="50" cy="50" r="44" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="276.46" stroke-dashoffset="0"/></svg>
        <div class="num" id="timerNum">20</div>
      </div>
      <div class="qimg-wrap" id="qImgWrap"><img id="qImg" alt=""></div>
      <div class="answered"><div class="big" id="ansCount">0</div><div class="lbl" id="tAnswers">odpowiedzi</div></div>
    </div>
    <div class="opts" id="qOpts"></div>
  </section>

  <!-- REVEAL -->
  <section class="view" id="vReveal">
    <div class="q-top"><div class="q-progress" id="rProg"></div></div>
    <div class="q-text" id="rText"></div>
    <div class="round-top" id="roundTop"></div>
    <div class="r-mid"><div class="qimg-wrap" id="rImgWrap"><img id="rImg" alt=""></div></div>
    <div class="opts" id="rOpts"></div>
  </section>

  <!-- LEADERBOARD -->
  <section class="view" id="vBoard">
    <div class="board-title" id="tBoard">Ranking</div>
    <div id="boardList"></div>
  </section>

  <!-- FINAL -->
  <section class="view" id="vFinal">
    <div class="board-title" id="tFinal">Zwycięzcy!</div>
    <div class="podium" id="podium"></div>
    <div id="finalRest"></div>
  </section>
</main>

<div id="controls">
  <button class="btn" id="btnMain">ROZPOCZNIJ</button>
  <button class="btn ghost" id="btnBoard" hidden>RANKING</button>
  <button class="btn ghost" id="btnEditor">EDYTUJ PYTANIA</button>
  <button class="btn ghost" id="btnCsv" hidden>EKSPORT CSV</button>
  <button class="btn ghost" id="btnNew">NOWA GRA</button>
  <span class="kbd" id="tKbd">spacja / → = dalej</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(() => {
  const CFG = window.QUIZ_CONFIG || {};
  const SC = Object.assign({ timeLimitSec:20, maxPoints:1000, minPoints:500, wrongPoints:0 }, CFG.scoring || {});
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const LETTERS = 'ABCDEF';

  /* ---------- TEKSTY ---------- */
  const STR = {
    pl:{ players:'graczy', join:'Dołącz do gry!', joinSub:'Zeskanuj kod telefonem, wpisz swoje imię i czekaj na pierwsze pytanie.',
      playersH:'Gracze', noPlayers:'Czekamy na pierwszych graczy…', question:'PYTANIE', answers:'odpowiedzi', pts:'pkt',
      start:'ROZPOCZNIJ QUIZ', resume:'KONTYNUUJ OD PYTANIA ', reveal:'POKAŻ ODPOWIEDŹ', board:'RANKING', next:'NASTĘPNE PYTANIE',
      final:'POKAŻ ZWYCIĘZCÓW', back:'WRÓĆ DO LOBBY', editor:'EDYTUJ PYTANIA', csv:'EKSPORT CSV', newGame:'NOWA GRA',
      kbd:'spacja / → = dalej', boardT:'Ranking', finalT:'Zwycięzcy!', nobody:'Nikt nie odpowiedział poprawnie 😅',
      fastest:'Najszybsi:', colPos:'#', colName:'Gracz', colPts:'Punkty', colTime:'Czas',
      hint:'<b>Format:</b> pytanie w pierwszej linii, pod nim odpowiedzi (po jednej w linii), poprawną oznacz gwiazdką *. Pusta linia oddziela pytania. Opcjonalnie <b>[30s]</b> na końcu pytania = własny limit czasu. Pytania zapisują się automatycznie w tej przeglądarce.',
      noQ:'Nie rozpoznano żadnego pytania — sprawdź format.', confirmNew:'Wyzerować wyniki i zacząć nową grę?',
      restored:n=>'Przywrócono wyniki poprzedniej sesji ('+n+' graczy). „NOWA GRA” zaczyna od zera.',
      peerErr:'Błąd połączenia: ', reconnecting:'Łączenie z serwerem gry…', connectingSrv:'Łączenie z serwerem gry…' },
    en:{ players:'players', join:'Join the game!', joinSub:'Scan the code with your phone, enter your name and wait for the first question.',
      playersH:'Players', noPlayers:'Waiting for the first players…', question:'QUESTION', answers:'answers', pts:'pts',
      start:'START QUIZ', resume:'CONTINUE FROM QUESTION ', reveal:'REVEAL ANSWER', board:'LEADERBOARD', next:'NEXT QUESTION',
      final:'SHOW WINNERS', back:'BACK TO LOBBY', editor:'EDIT QUESTIONS', csv:'EXPORT CSV', newGame:'NEW GAME',
      kbd:'space / → = next', boardT:'Leaderboard', finalT:'Winners!', nobody:'Nobody got it right 😅',
      fastest:'Fastest:', colPos:'#', colName:'Player', colPts:'Points', colTime:'Time',
      hint:'<b>Format:</b> question on the first line, answers below (one per line), mark the correct one with *. A blank line separates questions. Optional <b>[30s]</b> at the end of a question = custom time limit. Questions are saved automatically in this browser.',
      noQ:'No question recognised — check the format.', confirmNew:'Reset scores and start a new game?',
      restored:n=>'Restored scores from the previous session ('+n+' players). "NEW GAME" starts from scratch.',
      peerErr:'Connection error: ', reconnecting:'Connecting to the game server…', connectingSrv:'Connecting to the game server…' }
  };
  let lang = CFG.defaultLang === 'en' ? 'en' : 'pl';
  const t = k => STR[lang][k];

  /* ---------- STAN ---------- */
  const LS = { questions:'eq_questions', session:'eq_session', hostId:'eq_hostId' };
  const players = new Map();      // pid -> {pid,name,conn,online,score,timeMs,correct,lastGain,prevRank}
  let questions = [];
  let qIndex = 0;                 // indeks bieżącego / następnego pytania
  let state = 'lobby';            // lobby | question | reveal | board | final
  let round = null;               // {qi, startAt, limitMs, answers: Map pid->{index,ms,correct,points}}
  let timerInt = null;

  const store = {
    get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
    set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
    del(k){ try{ localStorage.removeItem(k); }catch(e){} }
  };

  /* ---------- PYTANIA ---------- */
  // Akceptujemy zdjęcia jako plik z repo (np. foto.jpg), link https lub obraz wgrany w edytorze (data:image)
  function safeSrc(src){
    src = String(src || '').trim();
    if (/^data:image\/(png|jpe?g|gif|webp|svg\+xml);base64,[A-Za-z0-9+/=]+$/i.test(src)) return src;
    if (/^https?:\/\/[^\s"'<>]+$/i.test(src)) return src;
    if (/^[\w\-./%]+\.(png|jpe?g|gif|webp|svg)$/i.test(src) && !src.includes('..')) return src;
    return null;
  }
  function parseQuestions(text){
    const out = [];
    text.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean).forEach(block => {
      const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
      if (lines.length < 3) return;
      let prompt = lines[0], limit = SC.timeLimitSec;
      const m = prompt.match(/\[(\d+)\s*s?\]\s*$/i);
      if (m){ limit = Math.max(5, parseInt(m[1], 10)); prompt = prompt.slice(0, m.index).trim(); }
      // opcjonalne zdjęcie pytania: druga linia „[zdjęcie] adres”
      let image = null, rest = lines.slice(1);
      if (rest.length && /^\[zdj[eę]cie\]/i.test(rest[0])){ image = safeSrc(rest[0].replace(/^\[zdj[eę]cie\]\s*/i, '')); rest = rest.slice(1); }
      const options = [], optionImages = []; let correctIndex = -1;
      rest.slice(0, 6).forEach(l => {
        if (l.startsWith('*')){ correctIndex = options.length; l = l.slice(1).trim(); }
        // opcjonalne zdjęcie odpowiedzi: „tekst [img] adres” albo samo „[img] adres”
        let txt = l, img = null;
        const k = l.indexOf('[img]');
        if (k >= 0){ txt = l.slice(0, k).trim(); img = safeSrc(l.slice(k + 5).trim()); }
        options.push(txt); optionImages.push(img);
      });
      if (correctIndex < 0 || options.length < 2) return;
      out.push({ prompt, image, options, optionImages, correctIndex, limit });
    });
    return out;
  }
  // Pytania: wersja z edytora (edytor.html, ta sama przeglądarka) albo z config.js
  const getQText = () => store.get(LS.questions) || CFG.questions || '';
  function updateQCount(){
    const n = parseQuestions(getQText()).length;
    $('qCount').textContent = (lang === 'pl' ? 'Pytań w quizie: ' : 'Questions in quiz: ') + n + (store.get(LS.questions) ? (lang === 'pl' ? ' (z edytora)' : ' (from editor)') : '');
  }
  // Edytor w drugim oknie zapisuje pytania — ekran odświeża je na bieżąco
  window.addEventListener('storage', e => {
    if (e.key !== LS.questions) return;
    if (state !== 'question' && state !== 'reveal'){ if (state !== 'lobby') questions = parseQuestions(getQText()); }
    updateQCount(); updateControls();
  });

  /* ---------- PUNKTACJA ---------- */
  function pointsFor(ms, limitMs){
    const f = Math.min(Math.max(ms / limitMs, 0), 1);
    return Math.round(SC.maxPoints - (SC.maxPoints - SC.minPoints) * f);
  }
  // Ranking: punkty malejąco, przy remisie krótszy łączny czas poprawnych odpowiedzi
  function ranked(){
    return Array.from(players.values()).filter(p => p.name)
      .sort((a,b) => (b.score - a.score) || (a.timeMs - b.timeMs) || a.name.localeCompare(b.name));
  }
  const fmtTime = ms => !ms ? '–' : (ms / 1000).toFixed(2).replace('.', lang === 'pl' ? ',' : '.') + ' s';

  /* ---------- SESJA (odporność na odświeżenie ekranu) ---------- */
  function saveSession(){
    const data = { qIndex, players: Array.from(players.values()).map(p => ({ pid:p.pid, name:p.name, score:p.score, timeMs:p.timeMs, correct:p.correct })) };
    store.set(LS.session, JSON.stringify(data));
  }
  function loadSession(){
    try{
      const d = JSON.parse(store.get(LS.session) || 'null');
      if (!d) return;
      (d.players || []).forEach(p => players.set(p.pid, Object.assign({ conn:null, online:false, lastGain:0, prevRank:null }, p)));
      qIndex = d.qIndex || 0;
      const n = Array.from(players.values()).filter(p => p.score > 0).length;
      if (n > 0 || qIndex > 0) $('restoreNote').textContent = t('restored')(players.size);
    }catch(e){}
  }

  /* ---------- KOMUNIKACJA ---------- */
  function send(p, msg){ if (p && p.conn && p.conn.open){ try{ p.conn.send(msg); }catch(e){} } }
  function broadcast(fn){ players.forEach(p => { if (p.online) send(p, typeof fn === 'function' ? fn(p) : fn); }); }
  function questionMsg(){
    const q = questions[round.qi];
    return { type:'question', qid:round.qi, qIndex:round.qi, qTotal:questions.length, prompt:q.prompt, image:q.image, options:q.options, optionImages:q.optionImages,
             limitMs:round.limitMs, remainingMs:Math.max(0, round.limitMs - (performance.now() - round.startAt)) };
  }
  function stateMsgFor(p){
    if (state === 'question' && round){
      const m = questionMsg();
      if (round.answers.has(p.pid)) m.answered = round.answers.get(p.pid).index;
      return m;
    }
    if (state === 'final') return finalMsgFor(p);
    if ((state === 'reveal' || state === 'board') && round && p.lastResult && p.lastResult.qid === round.qi) return p.lastResult;
    return { type:'lobby', score:p.score };
  }
  function finalMsgFor(p){
    const r = ranked(); const pos = r.findIndex(x => x.pid === p.pid);
    return { type:'final', rank: pos + 1, of: r.length, score: p.score, timeMs: p.timeMs };
  }

  function onAnswer(p, data){
    if (state !== 'question' || !round || data.qid !== round.qi || round.answers.has(p.pid)) return;
    const hostMs = performance.now() - round.startAt;
    if (hostMs > round.limitMs + 1500) return;              // spóźnione (z marginesem na sieć)
    const idx = parseInt(data.index, 10);
    const q = questions[round.qi];
    if (!(idx >= 0 && idx < q.options.length)) return;
    // Czas mierzony na telefonie (sprawiedliwy niezależnie od opóźnień sieci), ograniczony czasem z ekranu
    let ms = Number(data.elapsedMs);
    if (!isFinite(ms) || ms < 0) ms = hostMs;
    ms = Math.min(ms, hostMs, round.limitMs);
    const correct = idx === q.correctIndex;
    round.answers.set(p.pid, { index:idx, ms, correct, points: correct ? pointsFor(ms, round.limitMs) : SC.wrongPoints });
    send(p, { type:'ack', qid:round.qi, index:idx });
    $('ansCount').textContent = round.answers.size;
    const online = Array.from(players.values()).filter(x => x.online && x.name).length;
    if (round.answers.size >= online && online > 0) setTimeout(() => { if (state === 'question') reveal(); }, 700);
  }

  /* ---------- WIDOKI ---------- */
  function show(view){
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === view));
  }
  const shownChips = new Set();
  function renderPlayers(){
    const online = Array.from(players.values()).filter(p => p.online && p.name);
    $('pillPlayers').innerHTML = '<b>' + online.length + '</b> ' + t('players');
    $('lobbyCount').textContent = online.length;
    const list = Array.from(players.values()).filter(p => p.name);
    $('playerChips').innerHTML = list.length
      ? list.map(p => { const isNew = !shownChips.has(p.pid); shownChips.add(p.pid);
          return '<div class="chip' + (isNew ? ' new' : '') + (p.online ? '' : ' off') + '">' + esc(p.name) + '</div>'; }).join('')
      : '<div class="empty">' + t('noPlayers') + '</div>';
  }
  function optsHtml(q, counts, total){
    return q.options.map((o, i) => {
      const c = counts ? counts[i] || 0 : null;
      const w = counts && total ? Math.round(c / total * 100) : 0;
      const img = q.optionImages && q.optionImages[i];
      return '<div class="opt opt' + i + (img ? ' has-img' : '') + (img && !o ? ' img-only' : '') + (counts ? (i === q.correctIndex ? ' ok' : ' dim') : '') + '">' +
        (counts ? '<div class="fill" data-w="' + w + '"></div>' : '') +
        '<div class="L"><span>' + LETTERS[i] + '</span></div>' +
        (img ? '<img class="oimg" src="' + esc(img) + '" alt="">' : '') +
        '<div class="T">' + esc(o) + '</div>' +
        (counts ? '<div class="cnt">' + c + '</div>' : '') + '</div>';
    }).join('');
  }

  function setImg(imgId, wrapId, src){
    $(wrapId).classList.toggle('on', !!src);
    if (src) $(imgId).src = src; else $(imgId).removeAttribute('src');
  }
  function startQuestion(){
    const q = questions[qIndex];
    round = { qi:qIndex, startAt:performance.now(), limitMs:q.limit * 1000, answers:new Map() };
    state = 'question';
    $('qProg').textContent = t('question') + ' ' + (qIndex + 1) + ' / ' + questions.length;
    $('qPts').textContent = SC.maxPoints + ' ' + t('pts');
    $('qText').textContent = q.prompt;
    $('qOpts').innerHTML = optsHtml(q);
    setImg('qImg', 'qImgWrap', q.image);
    $('ansCount').textContent = '0';
    show('vQuestion');
    broadcast(questionMsg());
    clearInterval(timerInt);
    tick(); timerInt = setInterval(tick, 200);
    updateControls();
  }
  function tick(){
    if (!round) return;
    const left = Math.max(0, round.limitMs - (performance.now() - round.startAt));
    const sec = Math.ceil(left / 1000);
    $('timerNum').textContent = sec;
    $('timerBar').style.strokeDashoffset = (276.46 * (1 - left / round.limitMs)).toFixed(1);
    $('timer').classList.toggle('low', sec <= 5);
    if (left <= 0 && state === 'question') reveal();
  }

  function reveal(){
    if (state !== 'question') return;
    clearInterval(timerInt);
    state = 'reveal';
    const q = questions[round.qi];
    const before = ranked().map(p => p.pid);
    players.forEach(p => { p.prevRank = before.indexOf(p.pid); p.lastGain = 0; });
    round.answers.forEach((a, pid) => {
      const p = players.get(pid); if (!p) return;
      p.score += a.points; p.lastGain = a.points;
      if (a.correct){ p.correct++; p.timeMs += a.ms; }
    });
    qIndex = round.qi + 1;
    saveSession();

    const counts = q.options.map(() => 0);
    round.answers.forEach(a => counts[a.index]++);
    $('rProg').textContent = t('question') + ' ' + (round.qi + 1) + ' / ' + questions.length;
    $('rText').textContent = q.prompt;
    $('rOpts').innerHTML = optsHtml(q, counts, round.answers.size);
    setImg('rImg', 'rImgWrap', q.image);
    requestAnimationFrame(() => requestAnimationFrame(() =>
      document.querySelectorAll('#rOpts .fill').forEach(f => f.style.width = f.dataset.w + '%')));

    const fastest = Array.from(round.answers.entries()).filter(([, a]) => a.correct)
      .sort((a, b) => a[1].ms - b[1].ms).slice(0, 3);
    $('roundTop').innerHTML = fastest.length
      ? fastest.map(([pid, a], i) => '<div class="rt">' + ['🥇','🥈','🥉'][i] + ' <b>' + esc((players.get(pid) || {}).name) + '</b><span class="p">+' + a.points + '</span><span class="s">' + fmtTime(a.ms) + '</span></div>').join('')
      : '<div class="nobody">' + t('nobody') + '</div>';
    show('vReveal');
    if (fastest.length) confetti(1200, 70);

    const r = ranked();
    players.forEach(p => {
      const a = round.answers.get(p.pid);
      p.lastResult = { type:'result', qid:round.qi, correctIndex:q.correctIndex, answered: a ? a.index : null,
        correct: !!(a && a.correct), gained: a ? a.points : 0, ms: a ? a.ms : null,
        score: p.score, rank: r.findIndex(x => x.pid === p.pid) + 1, of: r.length };
      send(p, p.lastResult);
    });
    updateControls();
  }

  function renderBoard(){
    const r = ranked();
    const head = '<div class="row head"><div>' + t('colPos') + '</div><div>' + t('colName') + '</div><div style="text-align:right">' + t('colPts') + '</div><div style="text-align:right">' + t('colTime') + '</div></div>';
    $('boardList').innerHTML = head + r.slice(0, 10).map((p, i) =>
      '<div class="row' + (i < 3 ? ' top' + (i + 1) : '') + '"><div class="pos">' + (i + 1) + '</div><div class="nm">' + esc(p.name) +
      (p.lastGain > 0 ? '<span class="delta">+' + p.lastGain + '</span>' : '') + '</div><div class="pts">' + p.score + '</div><div class="tm">' + fmtTime(p.timeMs) + '</div></div>').join('');
  }
  function showBoard(){ state = 'board'; renderBoard(); show('vBoard'); updateControls(); }

  function showFinal(){
    state = 'final';
    const r = ranked();
    const slot = (p, n) => p ? '<div class="pod p' + n + '"><div class="info"><div class="who">' + esc(p.name) + '</div><div class="sc">' + p.score + ' ' + t('pts') + '</div><div class="tm">' + fmtTime(p.timeMs) + '</div></div><div class="block">' + n + '</div></div>' : '<div class="pod p' + n + '"></div>';
    $('podium').innerHTML = slot(r[1], 2) + slot(r[0], 1) + slot(r[2], 3);
    $('finalRest').innerHTML = r.slice(3).map((p, i) =>
      '<div class="row"><div class="pos">' + (i + 4) + '</div><div class="nm">' + esc(p.name) + '</div><div class="pts">' + p.score + '</div><div class="tm">' + fmtTime(p.timeMs) + '</div></div>').join('');
    show('vFinal');
    setTimeout(() => confetti(3500, 220), 1900);
    players.forEach(p => send(p, finalMsgFor(p)));
    updateControls();
  }

  function showLobby(){
    state = 'lobby'; round = null; clearInterval(timerInt);
    show('vLobby'); renderPlayers();
    broadcast(p => ({ type:'lobby', score:p.score }));
    updateControls();
  }

  /* ---------- PRZYCISKI ---------- */
  function mainLabel(){
    if (state === 'lobby') return (qIndex > 0 && qIndex < parseQuestions(getQText()).length) ? t('resume') + (qIndex + 1) : t('start');
    if (state === 'question') return t('reveal');
    if (state === 'reveal') return t('board');
    if (state === 'board') return qIndex < questions.length ? t('next') : t('final');
    return t('back');
  }
  function updateControls(){
    $('btnMain').textContent = mainLabel();
    $('btnBoard').hidden = !(state === 'lobby' && ranked().some(p => p.score > 0));
    $('btnBoard').textContent = t('board');
    $('btnEditor').hidden = !(state === 'lobby' || state === 'board');
    $('btnEditor').textContent = t('editor');
    $('btnCsv').hidden = !(state === 'final' || state === 'board' || state === 'lobby') || !ranked().length;
    $('btnCsv').textContent = t('csv');
    $('btnNew').textContent = t('newGame');
    $('btnNew').hidden = !(state === 'lobby' || state === 'final');
  }
  function mainAction(){
    if (state === 'lobby'){
      questions = parseQuestions(getQText());
      if (!questions.length){ alert(t('noQ')); return; }
      if (qIndex >= questions.length) qIndex = 0;
      $('restoreNote').textContent = '';
      startQuestion();
    } else if (state === 'question') reveal();
    else if (state === 'reveal') showBoard();
    else if (state === 'board') { questions = parseQuestions(getQText()); if (qIndex < questions.length) startQuestion(); else showFinal(); }
    else if (state === 'final') showLobby();
  }
  $('btnMain').addEventListener('click', mainAction);
  $('btnBoard').addEventListener('click', () => { renderBoard(); state = 'board'; show('vBoard'); questions = parseQuestions(getQText()); updateControls(); });
  // Edytor otwiera się w osobnym oknie, żeby publiczność na projektorze nie widziała odpowiedzi
  $('btnEditor').addEventListener('click', () => {
    const w = window.open('edytor.html', 'quizEditor', 'width=1100,height=850');
    if (!w) location.href = 'edytor.html';
  });
  $('btnNew').addEventListener('click', () => {
    if (!confirm(t('confirmNew'))) return;
    players.forEach((p, pid) => { if (!p.online) players.delete(pid); else Object.assign(p, { score:0, timeMs:0, correct:0, lastGain:0 }); });
    qIndex = 0; saveSession(); $('restoreNote').textContent = ''; showLobby();
  });
  $('btnCsv').addEventListener('click', () => {
    const rows = [['Miejsce','Gracz','Punkty','Poprawne','Czas poprawnych (s)']].concat(
      ranked().map((p, i) => [i + 1, p.name, p.score, p.correct, (p.timeMs / 1000).toFixed(2)]));
    const csv = '﻿' + rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(';')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
    a.download = 'wyniki-quizu.csv'; a.click();
  });
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
    if (e.code === 'Space' || e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === 'Enter'){ e.preventDefault(); mainAction(); }
  });
  $('btnFull').addEventListener('click', () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen().catch(() => {});
  });
  document.addEventListener('fullscreenchange', () => document.body.classList.toggle('clean', !!document.fullscreenElement));
  function renderTexts(){
    $('btnLang').textContent = lang === 'pl' ? 'EN' : 'PL';
    $('tJoin').textContent = t('join'); $('tJoinSub').textContent = t('joinSub');
    $('tPlayers').textContent = t('playersH'); $('tAnswers').textContent = t('answers');
    updateQCount(); $('tKbd').textContent = t('kbd');
    $('tBoard').textContent = t('boardT'); $('tFinal').textContent = t('finalT');
    renderPlayers(); updateControls();
    if (state === 'board') renderBoard();
  }
  $('btnLang').addEventListener('click', () => { lang = lang === 'pl' ? 'en' : 'pl'; renderTexts(); broadcast({ type:'lang', lang }); });

  /* ---------- KONFETTI ---------- */
  function confetti(duration, count){
    const cv = document.createElement('canvas');
    cv.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:999;';
    document.body.appendChild(cv);
    const dpr = window.devicePixelRatio || 1; cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
    const css = getComputedStyle(document.documentElement);
    const cols = ['--primary','--accent','--a1','--a2','--a3','--correct'].map(v => css.getPropertyValue(v).trim() || '#fff');
    const ps = Array.from({ length:count }, () => ({ x:Math.random() * innerWidth, y:-20 - Math.random() * innerHeight * .5,
      vx:(Math.random() - .5) * 3, vy:2 + Math.random() * 3, s:6 + Math.random() * 7, c:cols[Math.floor(Math.random() * cols.length)],
      r:Math.random() * 6, vr:(Math.random() - .5) * .3 }));
    const t0 = performance.now();
    (function loop(ts){
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .05; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); ctx.restore(); });
      if (ts - t0 < duration) requestAnimationFrame(loop); else cv.remove();
    })(t0);
  }

  /* ---------- PEERJS ---------- */
  let hostId = store.get(LS.hostId);
  if (!hostId) hostId = newHostId();
  let peer, retry = 0;
  function newHostId(){ const id = 'eventquiz-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); store.set(LS.hostId, id); return id; }
  let restartT = null;
  function restartPeer(delay){
    clearTimeout(restartT);
    restartT = setTimeout(() => { try{ peer && peer.destroy(); }catch(e){} startPeer(); }, delay);
  }
  function startPeer(){
    if (!$('qr').children.length) $('qr').innerHTML = '<div class="qr-wait">' + t('connectingSrv') + '</div>';
    peer = new Peer(hostId, { debug:0, config:{ iceServers:[{ urls:'stun:stun.l.google.com:19302' }, { urls:'stun:global.stun.twilio.com:3478' }] } });
    peer.on('open', id => {
      retry = 0;
      const dir = location.pathname.endsWith('/') ? location.pathname : location.pathname.slice(0, location.pathname.lastIndexOf('/') + 1);
      const url = new URL(dir + 'play.html', location.origin); url.searchParams.set('code', id);
      $('qr').innerHTML = '';
      new QRCode($('qr'), { text:url.toString(), width:512, height:512, colorDark:'#000000', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M });
      $('joinUrl').textContent = '';
    });
    peer.on('error', err => {
      if (err.type === 'peer-unavailable') return;              // telefon, który już zniknął — nic się nie dzieje
      if (err.type === 'unavailable-id'){
        // ten sam kod jest jeszcze zajęty (np. stara karta z quizem) — po kilku próbach bierzemy nowy kod
        retry++;
        if (retry > 6){ hostId = newHostId(); retry = 0; }
        restartPeer(2500); return;
      }
      // problemy z siecią / serwerem połączeń — ponawiamy automatycznie
      retry++;
      $('joinUrl').textContent = t('reconnecting') + ' (' + retry + ')';
      restartPeer(Math.min(2000 * retry, 10000));
    });
    peer.on('disconnected', () => {
      if (peer.destroyed) return;
      $('joinUrl').textContent = t('reconnecting');
      setTimeout(() => { try{ if (!peer.destroyed && peer.disconnected) peer.reconnect(); }catch(e){ restartPeer(2000); } }, 1000);
    });
    peer.on('connection', conn => {
      let pid = null;
      conn.on('data', data => {
        if (!data || typeof data !== 'object') return;
        if (data.type === 'hello'){
          pid = String(data.pid || conn.peer).slice(0, 40);
          let p = players.get(pid);
          if (!p){ p = { pid, name:null, conn:null, online:false, score:0, timeMs:0, correct:0, lastGain:0, prevRank:null }; players.set(pid, p); }
          if (p.conn && p.conn !== conn){ try{ p.conn.close(); }catch(e){} }
          p.conn = conn; p.online = true; p.lastSeen = Date.now();
          if (data.name) p.name = String(data.name).trim().slice(0, 18);
          renderPlayers(); updateControls(); saveSession();
          send(p, { type:'welcome', name:p.name, score:p.score, lang });
          if (p.name) send(p, stateMsgFor(p));
        } else if (pid && data.type === 'name'){
          const p = players.get(pid); if (!p) return;
          const had = !!p.name;
          p.name = String(data.name || '').trim().slice(0, 18) || p.name;
          renderPlayers(); saveSession();
          if (!had && p.name) send(p, stateMsgFor(p));
        } else if (pid && data.type === 'pong'){
          const p = players.get(pid); if (p) p.lastSeen = Date.now();
        } else if (pid && data.type === 'answer'){
          onAnswer(players.get(pid), data);
        }
      });
      conn.on('close', () => {
        const p = pid && players.get(pid);
        if (p && p.conn === conn){ p.online = false; p.conn = null; renderPlayers(); }
      });
    });
  }

  // Heartbeat: telefony wiedzą, że ekran żyje; ekran wie, kto naprawdę jest online
  setInterval(() => {
    const now = Date.now(); let changed = false;
    players.forEach(p => {
      if (!p.online) return;
      if (p.lastSeen && now - p.lastSeen > 20000){ p.online = false; p.conn = null; changed = true; return; }
      send(p, { type:'ping' });
    });
    if (changed) renderPlayers();
  }, 2000);

  loadSession();
  renderTexts();
  showLobby();
  startPeer();
})();
</script>
</body>
