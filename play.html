<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0E1020">
<title>Gracz</title>
<link rel="icon" href="favicon.svg?v=1" type="image/svg+xml">
<link rel="icon" href="favicon-32.png?v=1" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<script src="config.js?v=8"></script>
<script src="brand.js?v=8"></script>
<style>
  :root{
    --bg:#0E1020; --surface:#181B33; --text:#fff; --muted:#9AA0C3; --primary:#6C5CE7; --accent:#FFC531;
    --correct:#22C55E; --wrong:#EF4444; --a0:#6C5CE7; --a1:#00B4D8; --a2:#FF7A45; --a3:#E84393;
    --font-heading:system-ui, sans-serif; --font-body:system-ui, sans-serif; --heading-style:normal;
    --line:color-mix(in srgb, var(--text) 12%, transparent);
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overscroll-behavior:none; }
  body{ background:var(--bg); color:var(--text); font-family:var(--font-body); display:flex; flex-direction:column; min-height:100dvh; transition:background .3s; }
  body.ok{ background:color-mix(in srgb, var(--correct) 30%, var(--bg)); }
  body.bad{ background:color-mix(in srgb, var(--wrong) 28%, var(--bg)); }
  header{ display:flex; align-items:center; gap:10px; padding:calc(12px + env(safe-area-inset-top)) 16px 10px; }
  header img{ height:34px; width:auto; }
  header .name{ font-family:var(--font-heading); font-weight:800; font-size:17px; line-height:1.1; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .score{ background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-weight:800; font-size:14px; white-space:nowrap; }
  .score b{ color:var(--accent); }
  .status{ display:flex; align-items:center; justify-content:center; gap:8px; font-size:12px; color:var(--muted); padding:0 16px 6px; }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); animation:pulse 1s infinite; }
  .dot.on{ background:var(--correct); animation:none; }
  .dot.err{ background:var(--wrong); animation:none; }
  @keyframes pulse{ 50%{ opacity:.3; } }
  main{ flex:1; display:flex; flex-direction:column; padding:8px 16px calc(18px + env(safe-area-inset-bottom)); min-height:0; }
  .view{ display:none; flex:1; flex-direction:column; min-height:0; }
  .view.on{ display:flex; }
  .center{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px; }
  h1{ font-family:var(--font-heading); font-style:var(--heading-style); font-weight:800; font-size:32px; line-height:1.05; text-transform:uppercase; }
  header .name, .q-text, .result-pts{ font-style:var(--heading-style); }
  header .name{ text-transform:uppercase; font-size:19px; }
  .sub{ color:var(--muted); font-size:15px; line-height:1.5; max-width:320px; }
  input{ width:100%; max-width:340px; font:700 20px var(--font-body); text-align:center; background:var(--surface); color:var(--text); border:2px solid var(--line); border-radius:14px; padding:16px; outline:none; }
  input:focus{ border-color:var(--primary); }
  .btn{ width:100%; max-width:340px; font:800 17px var(--font-body); background:var(--primary); color:#fff; border:none; border-radius:14px; padding:17px; cursor:pointer; }
  .btn:disabled{ opacity:.4; }
  .big-emoji{ font-size:64px; line-height:1; }
  .spinner{ width:42px; height:42px; border:4px solid var(--surface); border-top-color:var(--primary); border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* pytanie */
  .q-meta{ display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:13px; font-weight:700; letter-spacing:.5px; margin-bottom:8px; }
  .bar{ height:6px; background:var(--surface); border-radius:3px; overflow:hidden; margin-bottom:12px; }
  .bar i{ display:block; height:100%; width:100%; background:var(--accent); transform-origin:left; }
  .q-text{ font-family:var(--font-heading); font-weight:800; font-size:clamp(18px, 5.4vw, 24px); line-height:1.3; text-align:center; margin-bottom:14px; }
  .opts{ flex:1; display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:1fr; gap:10px; min-height:0; }
  .opts.n2{ grid-template-columns:1fr; }
  .opt{ border:none; border-radius:16px; color:#fff; font:700 16px var(--font-body); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:12px 10px; cursor:pointer; text-align:center; min-height:90px; transition:transform .1s, opacity .2s; overflow-wrap:anywhere; }
  .opt:active{ transform:scale(.96); }
  .opt .L{ width:38px; height:38px; border-radius:10px; background:rgba(255,255,255,.22); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px; }
  .pbadge{ align-self:flex-start; background:var(--accent); color:#06223F; font-weight:800; font-size:12px; letter-spacing:.3px; border-radius:999px; padding:6px 14px; margin-bottom:10px; text-transform:uppercase; }
  .pbadge:empty{ display:none; }
  .form{ display:flex; flex-direction:column; gap:12px; flex:1; }
  .form .opts{ flex:0 0 auto; grid-auto-rows:auto; }
  .opts.multi .opt{ min-height:70px; }
  .opts.multi .opt.on{ outline:4px solid #fff; outline-offset:-4px; }
  .opts.multi .opt .L::after{ content:''; }
  .opts.multi .opt.on .L::after{ content:'✓'; }
  .tin{ width:100%; font:700 18px var(--font-body); background:#fff; color:#0F2537; border:2px solid var(--line); border-radius:14px; padding:15px 16px; outline:none; }
  .tin:focus{ border-color:var(--primary); }
  .letters{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
  .letters span{ width:34px; height:40px; border-radius:8px; background:#E8E9FD; color:#272B6A; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px; }
  .bline{ display:flex; align-items:center; gap:10px; background:var(--surface); border-radius:14px; padding:8px 12px; }
  .bline .bt{ font-weight:800; font-size:20px; white-space:nowrap; }
  .bline .bin{ flex:1; padding:12px; }
  .nwrap{ display:flex; gap:8px; align-items:stretch; }
  .nwrap .unit{ display:flex; align-items:center; white-space:nowrap; background:var(--surface); border-radius:14px; padding:0 16px; font-weight:800; }
  .sval{ text-align:center; font-weight:800; font-size:44px; color:var(--accent); }
  .rng{ width:100%; height:44px; accent-color:var(--primary); }
  .slab{ display:flex; justify-content:space-between; color:var(--muted); font-weight:700; }
  .mrow{ display:flex; flex-direction:column; gap:6px; background:var(--surface); border-radius:14px; padding:10px 12px; }
  .mlab{ font-weight:800; }
  .msel{ width:100%; font:600 16px var(--font-body); padding:12px; border-radius:10px; border:2px solid var(--line); background:#fff; color:#0F2537; }
  .fhint{ text-align:center; color:var(--muted); font-size:14px; }
  .btn.send{ max-width:none; margin-top:auto; }
  .btn.send.shake{ animation:shake .35s; }
  @keyframes shake{ 25%{ transform:translateX(-6px); } 75%{ transform:translateX(6px); } }
  .form.locked .tin, .form.locked .msel, .form.locked .opt, .form.locked .rng{ opacity:.5; }
  .form.locked .btn.send{ display:none; }
  .sent{ text-align:center; font-weight:800; color:var(--correct); font-size:17px; padding:10px; }
  .yours{ background:var(--surface); border-radius:12px; padding:10px 14px; font-size:14px; max-width:340px; }
  .yours[hidden]{ display:none; }
  .q-img{ display:block; max-width:100%; max-height:24vh; object-fit:contain; border-radius:12px; margin:0 auto 12px; }
  .q-img[hidden]{ display:none; }
  .opt .oimg{ width:100%; max-height:14vh; flex:1 1 auto; min-height:0; object-fit:contain; border-radius:10px; }
  .opt.has-img{ padding:8px; gap:6px; }
  .opt.has-img .L{ width:30px; height:30px; font-size:15px; }
  .correct-was{ display:flex; flex-direction:column; align-items:center; gap:8px; }
  .cw-img{ max-width:160px; max-height:110px; object-fit:contain; border-radius:8px; }
  .opt0{ background:var(--a0); } .opt1{ background:var(--a1); } .opt2{ background:var(--a2); } .opt3{ background:var(--a3); }
  .opt4{ background:#7A8A99; } .opt5{ background:#56606B; }
  .opts.locked .opt{ opacity:.25; pointer-events:none; }
  .opts.locked .opt.mine{ opacity:1; outline:4px solid #fff; outline-offset:-4px; }

  .result-pts{ font-family:var(--font-heading); font-weight:800; font-size:56px; color:var(--accent); }
  .stats{ display:flex; gap:10px; width:100%; max-width:340px; }
  .stat{ flex:1; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 8px; }
  .stat .v{ font-weight:800; font-size:22px; }
  .stat .k{ color:var(--muted); font-size:12px; margin-top:2px; }
  .correct-was{ background:var(--surface); border-radius:12px; padding:10px 14px; font-size:14px; max-width:340px; }
  .correct-was[hidden]{ display:none; }
  .correct-was b{ color:var(--correct); }
  .lang{ background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:8px; padding:5px 8px; font:600 12px var(--font-body); }
</style>
</head>
<body>
<header>
  <img data-brand="logo" alt="">
  <div class="name" data-brand="name">QUIZ</div>
  <div class="score" id="scorePill" hidden><b id="scoreVal">0</b> pkt</div>
  <button class="lang" id="btnLang">EN</button>
</header>
<div class="status"><div class="dot" id="dot"></div><span id="statusTxt">Łączenie…</span></div>

<main>
  <!-- imię -->
  <section class="view" id="vName">
    <div class="center">
      <h1 id="tHello">Cześć! Jak masz na imię?</h1>
      <div class="sub" id="tHelloSub">Twoje imię pojawi się w rankingu na ekranie.</div>
      <input id="inName" maxlength="18" autocomplete="nickname" enterkeyhint="go">
      <button class="btn" id="btnJoin" disabled>DOŁĄCZ</button>
    </div>
  </section>

  <!-- oczekiwanie -->
  <section class="view" id="vWait">
    <div class="center">
      <div class="spinner"></div>
      <h1 id="waitTitle">Jesteś w grze!</h1>
      <div class="sub" id="waitSub">Patrz na ekran — pierwsze pytanie już zaraz.</div>
    </div>
  </section>

  <!-- pytanie -->
  <section class="view" id="vQuestion">
    <div class="q-meta"><span id="qProg"></span><span id="qSec"></span></div>
    <div class="bar"><i id="qBar"></i></div>
    <div class="pbadge" id="qBadge"></div>
    <div class="q-text" id="qText"></div>
    <img id="qImg" class="q-img" alt="" hidden>
    <div class="opts" id="qOpts"></div>
  </section>

  <!-- wynik rundy -->
  <section class="view" id="vResult">
    <div class="center">
      <div class="big-emoji" id="rEmoji"></div>
      <h1 id="rTitle"></h1>
      <div class="result-pts" id="rPts"></div>
      <div class="stats">
        <div class="stat"><div class="v" id="rTime">–</div><div class="k" id="tTime">czas</div></div>
        <div class="stat"><div class="v" id="rRank">–</div><div class="k" id="tRank">miejsce</div></div>
        <div class="stat"><div class="v" id="rScore">0</div><div class="k" id="tTotal">razem</div></div>
      </div>
      <div class="yours" id="rYours" hidden></div>
      <div class="correct-was" id="rCorrect" hidden></div>
    </div>
  </section>

  <!-- finał -->
  <section class="view" id="vFinal">
    <div class="center">
      <div class="big-emoji" id="fEmoji">🏆</div>
      <h1 id="fTitle"></h1>
      <div class="result-pts" id="fScore"></div>
      <div class="sub" id="fSub"></div>
    </div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
(() => {
  const CFG = window.QUIZ_CONFIG || {};
  const $ = id => document.getElementById(id);
  const LETTERS = 'ABCDEF';
  const STR = {
    pl:{ connecting:'Łączenie z ekranem…', connected:'Połączono', reconnecting:'Łączenie ponownie…', noCode:'Brak kodu w linku — zeskanuj QR jeszcze raz',
      hello:'Cześć! Jak się nazywasz?', helloSub:'Ta nazwa pojawi się w rankingu na ekranie.', placeholder:'Twoje imię', join:'DOŁĄCZ',
      waitT:'Jesteś w grze!', waitS:'Patrz na ekran — pierwsze pytanie już zaraz.', waitNext:'Patrz na ekran — zaraz kolejne pytanie.',
      question:'PYTANIE', sent:'Odpowiedź wysłana!', sentSub:'Czekaj na wynik…', ok:'Dobrze!', bad:'Niestety…', none:'Koniec czasu!',
      time:'czas', rank:'miejsce', total:'razem', correctWas:'Poprawna odpowiedź: ', pts:'pkt',
      finalT:r=>r===1?'Wygrywasz! 🎉':'Zajmujesz '+r+'. miejsce', finalS:(of,t)=>'na '+of+' graczy · łączny czas poprawnych odpowiedzi: '+t,
      noRank:'Dziękujemy za grę!', send:'WYŚLIJ ODPOWIEDŹ', sent:'Odpowiedź wysłana — czekaj na wynik', typeHere:'Wpisz odpowiedź…', typeNum:'Wpisz liczbę…',
      closest:'Wygrywa odpowiedź najbliższa prawidłowej wartości', multiHint:'Zaznacz wszystkie poprawne odpowiedzi', pick:'wybierz…',
      yours:'Twoja odpowiedź: ', partial:'Częściowo dobrze', nearly:'Blisko!' },
    en:{ connecting:'Connecting to screen…', connected:'Connected', reconnecting:'Reconnecting…', noCode:'No code in the link — scan the QR again',
      hello:'Hi! What’s your name?', helloSub:'Your name will appear on the leaderboard.', placeholder:'Your name', join:'JOIN',
      waitT:'You’re in!', waitS:'Watch the screen — the first question is coming.', waitNext:'Watch the screen — next question soon.',
      question:'QUESTION', sent:'Answer sent!', sentSub:'Wait for the result…', ok:'Correct!', bad:'Not quite…', none:'Time’s up!',
      time:'time', rank:'place', total:'total', correctWas:'Correct answer: ', pts:'pts',
      finalT:r=>r===1?'You win! 🎉':'You finished #'+r, finalS:(of,t)=>'out of '+of+' players · total time of correct answers: '+t,
      noRank:'Thanks for playing!', send:'SEND ANSWER', sent:'Answer sent — wait for the result', typeHere:'Type your answer…', typeNum:'Type a number…',
      closest:'The closest answer wins', multiHint:'Select all correct answers', pick:'choose…',
      yours:'Your answer: ', partial:'Partly right', nearly:'Close!' }
  };
  let lang = CFG.defaultLang === 'en' ? 'en' : 'pl';
  const t = k => STR[lang][k];
  const fmt = ms => (ms / 1000).toFixed(2).replace('.', lang === 'pl' ? ',' : '.') + ' s';
  const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };

  // Stały identyfikator gracza — po odświeżeniu telefonu punkty zostają
  let pid = store.get('eq_pid');
  if (!pid){ pid = 'p' + Math.random().toString(36).slice(2, 12); store.set('eq_pid', pid); }
  let myName = store.get('eq_name') || '';
  let joined = false;
  let current = null;   // {qid, options, recvAt, limitMs, remainingMs}
  let lastQuestion = null, lastScreen = 'wait', lastResult = null, lastFinal = null;
  let barRaf = null;

  function show(v){ document.querySelectorAll('.view').forEach(x => x.classList.toggle('on', x.id === v)); }
  function setStatus(key, cls){ $('statusTxt').textContent = t(key); $('dot').className = 'dot' + (cls ? ' ' + cls : ''); statusKey = key; }
  let statusKey = 'connecting';
  function setScore(s){ $('scorePill').hidden = false; $('scoreVal').textContent = s; }
  function mood(c){ document.body.classList.remove('ok', 'bad'); if (c) document.body.classList.add(c); }

  /* ---------- imię ---------- */
  $('inName').value = myName;
  const validName = () => $('inName').value.trim().length >= 2;
  $('btnJoin').disabled = !validName();
  $('inName').addEventListener('input', () => { $('btnJoin').disabled = !validName(); });
  $('inName').addEventListener('keydown', e => { if (e.key === 'Enter' && validName()) join(); });
  $('btnJoin').addEventListener('click', join);
  function join(){
    myName = $('inName').value.trim().slice(0, 18);
    store.set('eq_name', myName);
    joined = true;
    registerPlayer();
    showWait(false);
    if (lastState) renderState();
  }
  function showWait(next){
    mood(); lastScreen = next ? 'waitNext' : 'wait';
    $('waitTitle').textContent = t('waitT');
    $('waitSub').textContent = next ? t('waitNext') : t('waitS');
    show('vWait');
  }

  /* ---------- pytanie ---------- */
  function showQuestion(d){
    mood(); lastScreen = 'question'; lastQuestion = d;
    current = { qid:d.qid, type:d.type || 'choice', options:d.options, recvAt:performance.now(), remainingMs:d.remainingMs, limitMs:d.limitMs, startAt:d.startAt };
    $('qProg').textContent = t('question') + ' ' + (d.qIndex + 1) + ' / ' + d.qTotal;
    $('qBadge').textContent = d.label || '';
    $('qText').textContent = d.prompt || '';
    if (d.image){ $('qImg').src = d.image; $('qImg').hidden = false; } else { $('qImg').hidden = true; $('qImg').removeAttribute('src'); }
    const box = $('qOpts');
    box.innerHTML = ''; box.className = 'opts';
    const type = current.type;
    const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
    const sendBtn = () => { const b = el('button', 'btn send', t('send')); return b; };

    if (type === 'choice'){
      const opts = toArr(d.options), imgs = toArr(d.optionImages);
      box.className = 'opts' + (opts.length === 2 ? ' n2' : '');
      opts.forEach((o, i) => {
        const b = el('button', 'opt opt' + i);
        b.appendChild(el('span', 'L', LETTERS[i]));
        if (imgs[i]){ const im = el('img', 'oimg'); im.src = imgs[i]; im.alt = ''; b.appendChild(im); b.classList.add('has-img'); }
        if (o) b.appendChild(el('span', '', o));
        b.addEventListener('click', () => { if (submit(i)){ box.classList.add('locked'); b.classList.add('mine'); } });
        box.appendChild(b);
      });
      if (d.answered != null && typeof d.answered === 'number'){ box.classList.add('locked'); const m = box.children[d.answered]; if (m) m.classList.add('mine'); }
    } else {
      box.className = 'form';
      const send = sendBtn();
      let collect = () => null;
      if (type === 'multi'){
        const opts = toArr(d.options), imgs = toArr(d.optionImages), sel = new Set();
        const grid = el('div', 'opts multi');
        opts.forEach((o, i) => {
          const b = el('button', 'opt opt' + i);
          b.appendChild(el('span', 'L', '')); if (imgs[i]){ const im = el('img', 'oimg'); im.src = imgs[i]; b.appendChild(im); b.classList.add('has-img'); }
          if (o) b.appendChild(el('span', '', o));
          b.addEventListener('click', () => { if (sel.has(i)){ sel.delete(i); b.classList.remove('on'); } else { sel.add(i); b.classList.add('on'); } });
          grid.appendChild(b);
        });
        box.appendChild(el('div', 'fhint', t('multiHint'))); box.appendChild(grid);
        collect = () => sel.size ? Array.from(sel) : null;
      } else if (type === 'text'){
        if (d.letters){ const lw = el('div', 'letters'); toArr(d.letters).forEach(c => lw.appendChild(el('span', '', c))); box.appendChild(lw); }
        const inp = el('input', 'tin'); inp.placeholder = d.placeholder || t('typeHere'); inp.maxLength = 80; inp.autocomplete = 'off'; inp.setAttribute('autocapitalize', 'off'); inp.enterKeyHint = 'send';
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') send.click(); });
        box.appendChild(inp);
        collect = () => inp.value.trim() || null;
      } else if (type === 'blanks'){
        const inputs = [];
        toArr(d.lines).forEach(line => {
          const row = el('div', 'bline');
          toArr(line).forEach(p => {
            if (p.t != null) row.appendChild(el('span', 'bt', String(p.t).replace(/\s*[–—-]\s*$/, '')));
            else { const inp = el('input', 'tin bin'); inp.autocomplete = 'off'; inp.setAttribute('autocapitalize', 'off'); inputs[p.b] = inp; row.appendChild(inp); }
          });
          box.appendChild(row);
        });
        collect = () => inputs.some(i => i && i.value.trim()) ? inputs.map(i => i ? i.value.trim() : '') : null;
      } else if (type === 'number'){
        const unit = d.unit || '';
        if (d.slider){
          const min = Number(d.min), max = Number(d.max), step = Number(d.step) || 1;
          const val = el('div', 'sval'); const rng = el('input', 'rng'); rng.type = 'range'; rng.min = min; rng.max = max; rng.step = step;
          rng.value = Math.round(((min + max) / 2) / step) * step;
          const upd = () => { val.textContent = fmtN(Number(rng.value)) + (unit ? ' ' + unit : ''); };
          rng.addEventListener('input', upd); upd();
          box.appendChild(val); box.appendChild(rng);
          const lab = el('div', 'slab'); lab.appendChild(el('span', '', fmtN(min) + unit)); lab.appendChild(el('span', '', fmtN(max) + unit)); box.appendChild(lab);
          collect = () => Number(rng.value);
        } else {
          const wrap = el('div', 'nwrap');
          const inp = el('input', 'tin num'); inp.type = 'text'; inp.inputMode = 'decimal'; inp.placeholder = d.placeholder || t('typeNum'); inp.autocomplete = 'off';
          inp.addEventListener('keydown', e => { if (e.key === 'Enter') send.click(); });
          wrap.appendChild(inp); if (unit) wrap.appendChild(el('span', 'unit', unit));
          box.appendChild(wrap); box.appendChild(el('div', 'fhint', t('closest')));
          collect = () => { const n = parseFloat(String(inp.value).replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : null; };
        }
      } else if (type === 'match'){
        const rights = toArr(d.rights), sels = [];
        toArr(d.lefts).forEach((l, i) => {
          const row = el('div', 'mrow'); row.appendChild(el('div', 'mlab', l));
          const sel = el('select', 'msel'); sel.appendChild(new Option(t('pick'), ''));
          rights.forEach((r, k) => sel.appendChild(new Option(r, k)));
          row.appendChild(sel); box.appendChild(row); sels.push(sel);
        });
        collect = () => sels.every(s => s.value !== '') ? sels.map(s => parseInt(s.value, 10)) : null;
      }
      send.addEventListener('click', () => {
        const v = collect();
        if (v == null){ send.classList.add('shake'); setTimeout(() => send.classList.remove('shake'), 400); return; }
        if (submit(v)) lockForm();
      });
      box.appendChild(send);
      if (d.answered != null) lockForm();
    }
    show('vQuestion');
    cancelAnimationFrame(barRaf);
    (function anim(){
      if (!current || current.qid !== d.qid) return;
      const left = Math.max(0, current.remainingMs - (performance.now() - current.recvAt));
      $('qBar').style.transform = 'scaleX(' + (left / current.limitMs) + ')';
      $('qSec').textContent = Math.ceil(left / 1000) + ' s';
      if (left > 0) barRaf = requestAnimationFrame(anim);
    })();
  }
  function lockForm(){
    const box = $('qOpts');
    box.classList.add('locked');
    box.querySelectorAll('input, select, button').forEach(e => e.disabled = true);
    if (!box.querySelector('.sent')){ const s = document.createElement('div'); s.className = 'sent'; s.textContent = '✓ ' + t('sent'); box.appendChild(s); }
  }
  const fmtN = v => String(Math.round(v * 1000) / 1000).replace('.', lang === 'pl' ? ',' : '.');
  // wysłanie odpowiedzi (raz na pytanie)
  function submit(v){
    if (!current || answeredQ[current.qid] != null) return false;
    const elapsed = Math.max(0, serverNow() - current.startAt);
    if (navigator.vibrate) navigator.vibrate(30);
    answeredQ[current.qid] = current.type === 'choice' ? v : 0;
    const rec = { v, elapsedMs:Math.round(elapsed), at:firebase.database.ServerValue.TIMESTAMP };
    if (current.type === 'choice') rec.index = v;
    if (room) room.child('answers/' + current.qid + '/' + pid).set(rec).catch(() => { setStatus('reconnecting', 'err'); });
    return true;
  }

  /* ---------- wynik ---------- */
  function showResult(d){
    lastScreen = 'result'; lastResult = d; current = null; cancelAnimationFrame(barRaf);
    const answered = d.answered != null && d.answered >= 0;
    mood(d.correct ? 'ok' : 'bad');
    $('rEmoji').textContent = d.correct ? '✅' : (answered ? '❌' : '⏰');
    $('rTitle').textContent = d.correct ? t('ok') : (answered ? t('bad') : t('none'));
    $('rPts').textContent = '+' + d.gained;
    $('rTime').textContent = d.ms != null && d.ms >= 0 ? fmt(d.ms) : '–';
    $('rRank').textContent = d.rank > 0 ? d.rank + '/' + d.of : '–';
    $('rScore').textContent = d.score;
    const same = lastQuestion && lastQuestion.qid === d.qid && (d.qtype || 'choice') === 'choice' && lastQuestion.options;
    const opt = same ? (toArr(lastQuestion.options)[d.correctIndex] || (lastQuestion.optionImages && toArr(lastQuestion.optionImages)[d.correctIndex] ? '🖼' : '')) : null;
    $('rCorrect').hidden = d.correct || (!opt && !d.correctText);
    if (!opt && d.correctText && !d.correct){ $('rCorrect').innerHTML = ''; $('rCorrect').append(t('correctWas')); const b = document.createElement('b'); b.textContent = d.correctText; $('rCorrect').append(b); }
    $('rYours').hidden = !d.yours || (d.qtype || 'choice') === 'choice';
    $('rYours').textContent = d.yours ? t('yours') + d.yours : '';
    if (!d.correct && d.partial > 0 && d.qtype !== 'number'){ $('rTitle').textContent = t('partial') + ' (' + d.partial + '%)'; $('rEmoji').textContent = '🟡'; }
    if (d.qtype === 'number' && !d.correct && d.gained > 0){ $('rTitle').textContent = t('nearly'); $('rEmoji').textContent = '🎯'; }
    if (opt){ $('rCorrect').innerHTML = ''; $('rCorrect').append(t('correctWas')); const b = document.createElement('b'); b.textContent = LETTERS[d.correctIndex] + '. ' + opt; $('rCorrect').append(b);
      const ci = lastQuestion.optionImages && lastQuestion.optionImages[d.correctIndex];
      if (ci){ const im = document.createElement('img'); im.src = ci; im.alt = ''; im.className = 'cw-img'; $('rCorrect').append(im); } }
    setScore(d.score);
    if (navigator.vibrate) navigator.vibrate(d.correct ? [40, 60, 40] : 120);
    show('vResult');
  }
  function showFinal(d){
    lastScreen = 'final'; lastFinal = d; mood(d.rank > 0 && d.rank <= 3 ? 'ok' : null);
    $('fEmoji').textContent = d.rank === 1 ? '🏆' : d.rank === 2 ? '🥈' : d.rank === 3 ? '🥉' : '🎯';
    $('fTitle').textContent = d.rank > 0 ? t('finalT')(d.rank) : t('noRank');
    $('fScore').textContent = d.score + ' ' + t('pts');
    $('fSub').textContent = d.rank > 0 ? t('finalS')(d.of, fmt(d.timeMs)) : '';
    setScore(d.score);
    show('vFinal');
  }

  function renderTexts(){
    $('btnLang').textContent = lang === 'pl' ? 'EN' : 'PL';
    $('tHello').textContent = t('hello'); $('tHelloSub').textContent = t('helloSub');
    $('inName').placeholder = (CFG.nameLabel && CFG.nameLabel[lang]) || t('placeholder'); $('btnJoin').textContent = t('join');
    $('tTime').textContent = t('time'); $('tRank').textContent = t('rank'); $('tTotal').textContent = t('total');
    $('scorePill').lastChild.textContent = ' ' + t('pts');
    setStatus(statusKey, $('dot').className.replace('dot', '').trim());
    if (lastScreen === 'wait' || lastScreen === 'waitNext'){ if (joined) showWait(lastScreen === 'waitNext'); }
    else if (lastScreen === 'question' && lastQuestion) $('qProg').textContent = t('question') + ' ' + (lastQuestion.qIndex + 1) + ' / ' + lastQuestion.qTotal;
    else if (lastScreen === 'result' && lastResult) showResult(lastResult);
    else if (lastScreen === 'final' && lastFinal) showFinal(lastFinal);
  }
  $('btnLang').addEventListener('click', () => { lang = lang === 'pl' ? 'en' : 'pl'; renderTexts(); });

  /* ---------- serwer (Firebase Realtime Database) ---------- */
  const ROOM = String(new URLSearchParams(location.search).get('room') || CFG.roomId || '').replace(/[^\w-]/g, '');
  let db = null, room = null, serverOffset = 0;
  const serverNow = () => Date.now() + serverOffset;
  let lastState = null, myResult = null;
  const answeredQ = {};      // qid -> indeks wybranej odpowiedzi (żeby po odświeżeniu nie odpowiadać drugi raz)

  function registerPlayer(){
    if (!room || !joined) return;
    const me = room.child('players/' + pid);
    me.onDisconnect().update({ online:false });
    me.update({ name:myName, online:true, seen:firebase.database.ServerValue.TIMESTAMP }).catch(() => setStatus('reconnecting', 'err'));
  }

  function renderState(){
    const st = lastState; if (!st || !joined) return;
    if (st.lang && st.lang !== lang){ lang = st.lang; renderTexts(); }
    if (st.phase === 'question'){
      if (lastScreen === 'question' && current && current.qid === st.qid) return;
      const d = Object.assign({}, st, { options: toArr(st.options), optionImages: toArr(st.optionImages), type: st.type || 'choice' });
      d.remainingMs = Math.max(0, Math.min(d.limitMs, d.limitMs - (serverNow() - d.startAt)));
      if (answeredQ[st.qid] != null) d.answered = answeredQ[st.qid];
      if (d.remainingMs <= 0 && d.answered == null){ showWait(true); return; }
      showQuestion(d);
      // po odświeżeniu telefonu sprawdź, czy już odpowiedziano na to pytanie
      if (d.answered == null) room.child('answers/' + st.qid + '/' + pid).once('value').then(s => {
        const v = s.val(); if (v && current && current.qid === st.qid){
          if (current.type === 'choice'){ answeredQ[st.qid] = v.index; const box = $('qOpts'); box.classList.add('locked'); const m = box.children[v.index]; if (m) m.classList.add('mine'); }
          else { answeredQ[st.qid] = 0; lockForm(); } }
      });
    } else if (st.phase === 'reveal' || st.phase === 'board'){
      if (myResult && myResult.type === 'result' && myResult.qid === st.qid){ if (lastScreen !== 'result' || !lastResult || lastResult.qid !== st.qid) showResult(myResult); }
      else showWait(true);
    } else if (st.phase === 'final'){
      if (myResult && myResult.type === 'final') showFinal(myResult); else showWait(true);
    } else {
      showWait(lastScreen !== 'wait' && lastScreen !== 'name');
    }
  }
  const toArr = v => Array.isArray(v) ? v : (v && typeof v === 'object' ? Object.keys(v).sort((a, b) => a - b).map(k => v[k]) : []);

  function initServer(){
    try{
      firebase.initializeApp(CFG.firebase);
      db = firebase.database();
      room = db.ref('quiz/' + ROOM);
    }catch(e){ setStatus('reconnecting', 'err'); return; }
    db.ref('.info/serverTimeOffset').on('value', s => { serverOffset = s.val() || 0; });
    db.ref('.info/connected').on('value', s => {
      if (s.val()){ setStatus('connected', 'on'); registerPlayer(); }
      else setStatus('reconnecting', 'err');
    });
    room.child('state').on('value', s => { lastState = s.val(); renderState(); });
    room.child('results/' + pid).on('value', s => { myResult = s.val(); renderState(); });
    room.child('scores/' + pid + '/score').on('value', s => { const v = s.val(); if (typeof v === 'number') setScore(v); });
    // imię zapamiętane na serwerze (np. po wyczyszczeniu pamięci telefonu)
    room.child('players/' + pid + '/name').once('value').then(s => {
      const n = s.val();
      if (n && !joined){ joined = true; myName = n; store.set('eq_name', n); registerPlayer(); showWait(false); renderState(); }
    });
  }

  renderTexts();
  if (!ROOM || typeof firebase === 'undefined' || !CFG.firebase){ setStatus('noCode', 'err'); show('vName'); $('btnJoin').disabled = true; }
  else {
    setStatus('connecting');
    if (myName){ joined = true; showWait(false); } else show('vName');
    initServer();
  }
})();
</script>
</body>
</html>
